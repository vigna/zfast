[package]
name = "zfast-bench"
version = "0.1.0"
edition = "2024"
description = "Driver for the comparative benchmarks of z-fast tries"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
zfast = { path = "../../crate" }
mem_dbg = "0.4.1"
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
